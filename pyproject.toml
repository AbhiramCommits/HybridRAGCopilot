[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hybridrag"
version = "0.1.0"
description = "Enterprise-document copilot with mixed structured and unstructured corpus and hybrid RRF retrieval"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "torch>=2.2.0",
    "transformers>=4.38.0",
    "sentence-transformers>=2.5.1",
    "peft>=0.9.0",
    "faiss-cpu>=1.8.0",
    "rank-bm25>=0.2.2",
    "psycopg[binary]>=3.1.18",
    "sqlalchemy>=2.0.28",
    "pyyaml>=6.0.1",
    "pyarrow>=15.0.0",
    "pandas>=2.2.1",
    "prometheus-client>=0.20.0"
]

[tool.setuptools.packages.find]
include = ["hybridrag*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
asyncio_mode = "auto"
